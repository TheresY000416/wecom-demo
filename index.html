<title>工作台</title>
<style>
  * { box-sizing:border-box; }
  html,body {
    margin:0; width:100%; height:100%; overflow:hidden; background:#000;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    overscroll-behavior:none;
  }
  #app { position:fixed; inset:0; overflow:hidden; background:#000; }
  .screen {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transform:translateX(100%);
    transition:transform .24s cubic-bezier(.2,.8,.2,1), opacity .18s ease;
    background:#000; will-change:transform,opacity;
  }
  .screen img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  #home { opacity:1; visibility:visible; transform:translateX(0); z-index:1; }
  .screen.active { opacity:1; visibility:visible; transform:translateX(0); z-index:5; }
  #app.in-flow #home { transform:translateX(-16%); }
  .loading-swap { transition:opacity .14s linear !important; transform:none !important; }

  button.hotspot {
    position:absolute; z-index:20; border:0; padding:0; margin:0; background:transparent;
    -webkit-tap-highlight-color:transparent; outline:none;
  }
  #faceHotspot { left:50.5%; top:57.0%; width:20.5%; height:13.5%; }
  .backHotspot { left:0; top:4.0%; width:22%; height:9.0%; }

  /* iOS-like elastic vertical overscroll on the final page. */
  #final { overflow:hidden; background:#000; touch-action:none; }
  #final > img {
    transform:translate3d(0,0,0);
    will-change:transform;
    backface-visibility:hidden;
  }
  #final > img.elastic-return {
    transition:transform .34s cubic-bezier(.22,.85,.25,1);
  }

</style>

<script>
(() => {
  const app = document.getElementById('app');
  const loading1 = document.getElementById('loading1');
  const loading2 = document.getElementById('loading2');
  const finalPage = document.getElementById('final');
  const finalImg = finalPage.querySelector('img');
  const face = document.getElementById('faceHotspot');
  const subScreens = [loading1, loading2, finalPage];

  let timers = [];
  let inFlow = false;

  function clearTimers() {
    timers.forEach(clearTimeout);
    timers = [];
  }

  function showOnly(el) {
    subScreens.forEach(s => s.classList.toggle('active', s === el));
    if (el !== finalPage) snapFinal(false);
  }

  function snapFinal(animate = true) {
    if (!finalImg) return;
    if (animate) {
      finalImg.classList.add('elastic-return');
      requestAnimationFrame(() => {
        finalImg.style.transform = 'translate3d(0,0,0)';
      });
      setTimeout(() => finalImg.classList.remove('elastic-return'), 380);
    } else {
      finalImg.classList.remove('elastic-return');
      finalImg.style.transform = 'translate3d(0,0,0)';
    }
  }

  function resetHome(fromHistory = false) {
    clearTimers();
    snapFinal(false);
    inFlow = false;
    app.classList.remove('in-flow');
    subScreens.forEach(s => s.classList.remove('active'));
    if (!fromHistory && location.hash) history.back();
  }

  function startFlow() {
    if (inFlow) return;
    inFlow = true;
    snapFinal(false);
    app.classList.add('in-flow');
    showOnly(loading1);
    if (location.hash !== '#face') history.pushState({page:'face'}, '', '#face');

    timers.push(setTimeout(() => showOnly(loading2), 720));
    timers.push(setTimeout(() => showOnly(finalPage), 1780));
  }

  face.addEventListener('click', startFlow);
  document.querySelectorAll('.backHotspot').forEach(btn =>
    btn.addEventListener('click', () => resetHome())
  );
  window.addEventListener('popstate', () => resetHome(true));

  // Unified touch gesture:
  // - Horizontal swipe on any subpage returns directly to page 1.
  // - Vertical drag on the final page produces a resisted black-edge overscroll,
  //   then springs back when the finger is released.
  let sx = 0, sy = 0, lastX = 0, lastY = 0;
  let tracking = false;
  let axis = null;

  document.addEventListener('touchstart', e => {
    if (!inFlow || !e.touches.length) return;
    const t = e.touches[0];
    sx = lastX = t.clientX;
    sy = lastY = t.clientY;
    tracking = true;
    axis = null;
    if (finalPage.classList.contains('active')) {
      finalImg.classList.remove('elastic-return');
    }
  }, {passive:true});

  document.addEventListener('touchmove', e => {
    if (!tracking || !inFlow || !e.touches.length) return;
    const t = e.touches[0];
    lastX = t.clientX;
    lastY = t.clientY;
    const dx = lastX - sx;
    const dy = lastY - sy;

    if (!axis && Math.hypot(dx, dy) > 8) {
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }

    if (axis === 'y' && finalPage.classList.contains('active')) {
      e.preventDefault();
      const sign = dy < 0 ? -1 : 1;
      const abs = Math.abs(dy);
      // Rubber-band resistance: strong at first, progressively stiffer.
      const resisted = Math.min(96, 0.42 * abs / (1 + abs / 210));
      finalImg.style.transform = `translate3d(0,${sign * resisted}px,0)`;
    }
  }, {passive:false});

  document.addEventListener('touchend', e => {
    if (!tracking || !inFlow) return;
    tracking = false;
    const t = e.changedTouches && e.changedTouches[0];
    const ex = t ? t.clientX : lastX;
    const ey = t ? t.clientY : lastY;
    const dx = ex - sx;
    const dy = ey - sy;

    if (axis === 'x' && Math.abs(dx) > 58 && Math.abs(dx) > Math.abs(dy) * 1.08) {
      resetHome();
      axis = null;
      return;
    }

    if (finalPage.classList.contains('active')) snapFinal(true);
    axis = null;
  }, {passive:true});

  document.addEventListener('touchcancel', () => {
    if (!tracking) return;
    tracking = false;
    if (finalPage.classList.contains('active')) snapFinal(true);
    axis = null;
  }, {passive:true});

  // Desktop preview support with the same elastic feel.
  let px=0, py=0, pd=false, paxis=null;
  document.addEventListener('pointerdown', e => {
    if (!inFlow) return;
    px=e.clientX; py=e.clientY; pd=true; paxis=null;
    if (finalPage.classList.contains('active')) finalImg.classList.remove('elastic-return');
  });
  document.addEventListener('pointermove', e => {
    if (!pd || !inFlow) return;
    const dx=e.clientX-px, dy=e.clientY-py;
    if (!paxis && Math.hypot(dx,dy)>8) paxis=Math.abs(dx)>Math.abs(dy)?'x':'y';
    if (paxis==='y' && finalPage.classList.contains('active')) {
      const sign=dy<0?-1:1, abs=Math.abs(dy);
      const resisted=Math.min(96,0.42*abs/(1+abs/210));
      finalImg.style.transform=`translate3d(0,${sign*resisted}px,0)`;
    }
  });
  document.addEventListener('pointerup', e => {
    if (!pd || !inFlow) return;
    pd=false;
    const dx=e.clientX-px, dy=e.clientY-py;
    if (paxis==='x' && Math.abs(dx)>58 && Math.abs(dx)>Math.abs(dy)*1.08) {
      resetHome();
    } else if (finalPage.classList.contains('active')) {
      snapFinal(true);
    }
    paxis=null;
  });
})();
</script>
</body>
</html>
