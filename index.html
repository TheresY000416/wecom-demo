    <button id="backHotspot" aria-label="返回工作台"></button>
  </section>
</div>

<script>
(() => {
  const app = document.getElementById('app');
  const face = document.getElementById('faceHotspot');
  const back = document.getElementById('backHotspot');

  function openPage2() {
    app.classList.add('show2');
    history.pushState({page:2}, '', '#user-info');
  }
  function backToPage1(fromHistory=false) {
    app.classList.remove('show2');
    if (!fromHistory && location.hash) history.back();
  }

  face.addEventListener('click', openPage2);
  back.addEventListener('click', () => backToPage1());

  window.addEventListener('popstate', () => {
    app.classList.remove('show2');
  });

  // 支持第二页横向滑动返回：左滑/右滑都兼容，避免手势方向理解差异
  let sx = 0, sy = 0, tracking = false;
  document.addEventListener('touchstart', e => {
    if (!app.classList.contains('show2') || !e.touches.length) return;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    tracking = true;
  }, {passive:true});

  document.addEventListener('touchend', e => {
    if (!tracking || !app.classList.contains('show2') || !e.changedTouches.length) return;
    tracking = false;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.15) {
      backToPage1();
    }
  }, {passive:true});

  // 桌面预览也支持鼠标横向拖动
  let mx = 0, my = 0, md = false;
  document.addEventListener('pointerdown', e => {
    if (!app.classList.contains('show2')) return;
    mx = e.clientX; my = e.clientY; md = true;
  });
  document.addEventListener('pointerup', e => {
    if (!md || !app.classList.contains('show2')) return;
    md = false;
    const dx = e.clientX - mx, dy = e.clientY - my;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.15) backToPage1();
  });
})();
</script>
