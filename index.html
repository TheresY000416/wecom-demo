    <button class="hotspot backHotspot" aria-label="返回"></button>
  </section>
</div>

<script>
(() => {
  const app = document.getElementById('app');
  const home = document.getElementById('home');
  const loading1 = document.getElementById('loading1');
  const loading2 = document.getElementById('loading2');
  const finalPage = document.getElementById('final');
  const face = document.getElementById('faceHotspot');
  const subScreens = [loading1, loading2, finalPage];
  let timers = [];
  let inFlow = false;

  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function showOnly(el) {
    subScreens.forEach(s => s.classList.toggle('active', s === el));
  }
  function resetHome(fromHistory=false) {
    clearTimers();
    inFlow = false;
    app.classList.remove('in-flow');
    subScreens.forEach(s => s.classList.remove('active'));
    if (!fromHistory && location.hash) history.back();
  }
  function startFlow() {
    if (inFlow) return;
    inFlow = true;
    app.classList.add('in-flow');
    showOnly(loading1);
    if (location.hash !== '#face') history.pushState({page:'face'}, '', '#face');

    timers.push(setTimeout(() => showOnly(loading2), 720));
    timers.push(setTimeout(() => showOnly(finalPage), 1780));
  }

  face.addEventListener('click', startFlow);
  document.querySelectorAll('.backHotspot').forEach(btn => btn.addEventListener('click', () => resetHome()));
  window.addEventListener('popstate', () => resetHome(true));

  // Any horizontal swipe from either loading page or the final page returns directly to page 1.
  // Both directions are accepted so the gesture remains forgiving in WeCom/iOS webview.
  let sx=0, sy=0, tracking=false;
  document.addEventListener('touchstart', e => {
    if (!inFlow || !e.touches.length) return;
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; tracking=true;
  }, {passive:true});
  document.addEventListener('touchend', e => {
    if (!tracking || !inFlow || !e.changedTouches.length) return;
    tracking=false;
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    if (Math.abs(dx) > 58 && Math.abs(dx) > Math.abs(dy)*1.15) resetHome();
  }, {passive:true});

  // Desktop preview support.
  let px=0, py=0, pd=false;
  document.addEventListener('pointerdown', e => { if(inFlow){px=e.clientX;py=e.clientY;pd=true;} });
  document.addEventListener('pointerup', e => {
    if(!pd || !inFlow) return; pd=false;
    const dx=e.clientX-px, dy=e.clientY-py;
    if(Math.abs(dx)>58 && Math.abs(dx)>Math.abs(dy)*1.15) resetHome();
  });
})();
</script>
